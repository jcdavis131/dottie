[project]
name = "bigbang-cli"
version = "0.1.0"
description = "The personal control plane for everything — your local-first, agent-native CLI that keeps growing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["cli", "agent", "personal", "automation", "mcp"]
dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.optional-dependencies]
all = ["plaid-python", "gspread", "supabase", "onnxruntime"]
dev = ["pytest>=8", "ruff>=0.3", "mypy>=1.8", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/jcdavis131/bigbang-cli"
Issues = "https://github.com/jcdavis131/bigbang-cli/issues"

[project.scripts]
bb = "bigbang.cli:app"
bigbang = "bigbang.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bigbang", "bigbang.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

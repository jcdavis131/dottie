# dottie — virtual uv workspace root (no [project]: the root itself is not a package).
# Members: the four already-pyproject-based packages with no conflicting hard pins.
# Excluded BY DESIGN (see README):
#   apps/scout-rtx    — hard-pins torch==2.9.1 + cu128 wheel index; resolved independently
#   apps/ava-factory  — requirements.txt/Docker-driven install, no pyproject; untouched
[tool.uv.workspace]
members = [
  "packages/ava-skills",
  "packages/ava-open-harness",
  "packages/personal-graphify",
  "apps/scout-cli",
]
exclude = ["apps/scout-rtx", "apps/ava-factory"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8,<0.9", "pre-commit>=3.7"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "graphify_out*", "results/*", "graphify_out-combined", "graphify_out/*", "apps/ava-factory/graphify_out/*", ".mypy_cache", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


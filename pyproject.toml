[project]
name = "personal-graphify"
version = "0.1.0"
description = "Personal Graphify — Knowledge Graphs for AI Coding Assistants (Solo, Ollama-first, for Davis family ecosystem)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Cameron Davis", email="jcdavis131@gmail.com"}]
# Core = what the code hard-imports: networkx (graph) + python-frontmatter (md metadata).
# Everything else is imported behind try/except with graceful fallback → optional extras.
dependencies = [
  "networkx>=3.0",
  "python-frontmatter>=1.0",
]

[project.optional-dependencies]
# `uv tool install "personal-graphify[ollama]"` — semantic rerank via local Ollama embeddings
ollama = ["ollama>=0.3.0"]
# HTTP MCP server (stdio transport needs nothing extra)
serve = ["fastapi>=0.100", "uvicorn>=0.23"]
# Tree-sitter JS/TS parsing (regex fallback used when absent)
treesitter = [
  "tree-sitter>=0.20",
  "tree-sitter-python>=0.20",
  "tree-sitter-javascript>=0.20",
  "tree-sitter-typescript>=0.20",
]
# Spectral (Graph Laplacian) community backend
spectral = ["numpy>=1.24"]
all = ["personal-graphify[ollama,serve,treesitter,spectral]"]

[project.scripts]
personal-graphify = "personal_graphify.cli:main"
pgraphify = "personal_graphify.cli:main"
graphify-personal = "personal_graphify.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

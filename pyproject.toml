[project]
name = "bigbang-cli"
version = "0.4.0"
description = "One CLI to rule all tools — agent-native, security-first, MCP + OpenAPI + Ava brain. No personal finance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["cli", "agent", "tools", "mcp", "openapi", "automation", "ai"]
dependencies = [
  "typer[all]>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "click>=8.1",
  "mcp>=1.28.1",
]

[project.optional-dependencies]
all = ["gspread", "supabase", "onnxruntime", "keyring", "cryptography", "mcp>=1.28.1"]
dev = ["pytest>=8", "ruff>=0.3", "mypy>=1.8", "pytest-cov"]
security = ["keyring", "cryptography"]

[project.urls]
Homepage = "https://github.com/jcdavis131/bigbang-cli"
Issues = "https://github.com/jcdavis131/bigbang-cli/issues"

[project.scripts]
bb = "bigbang.cli:app"
bigbang = "bigbang.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bigbang", "bigbang.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

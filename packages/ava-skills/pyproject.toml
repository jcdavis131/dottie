[project]
name = "ava-skills"
version = "0.1.0"
description = "Skill system for Ava AGI Factory v6.4 - J-Space routed, half-life aware, openwiki-synced. Solo personal project, no connection to employer, built with public/free-tier only"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name="Cam Davis"}]
dependencies = ["pyyaml>=6"]
keywords = ["agi", "skills", "j-space", "openwiki"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/jcdavis131/ava-skills"

[project.scripts]
ava-skills = "skills.loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["skills", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "graphify_out*", "results/*", ".mypy_cache", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311","W505","RUF005","B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

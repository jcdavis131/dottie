[project]
name = "dottie-loop"
version = "0.1.0"
description = "dottie_loop — the Dottie Full Ecosystem contracts and gates as typed, fail-closed, stdlib-only code: goal intake, approvals, plan graphs, timelines/checkpoints, opt-in pair capture, reward, dataset QA, training preflight, evaluation gates, promotion/rollback, closed-loop trigger, Forge job queue, benchmark builder."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["dottie", "agents", "closed-loop", "fail-closed", "contracts"]
# stdlib only, by design (spec §35.1 cost posture: no new pip installs without approval).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dottie-loop = "dottie_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dottie_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dottie_loop","jarvisd","dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

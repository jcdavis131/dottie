name: uptime
version: 0.7.0
description: UptimeRobot/Pingdom-class monitoring, fully local (openswap #2 — stdlib probe loop + sqlite incident ledger)
capabilities:
  network:
    enabled: true
    # The monitored fleet ONLY (host exact-or-dot-suffix match): the 8 sites,
    # the bluehenre API, and local ollama. Adding a host to a --targets
    # overlay requires adding its domain here too — default-deny is the point.
    domains:
      - dumbmodel.com
      - jcamd.com
      - arxiviq.com
      - bhenre.com
      - bluehenre-campus.vercel.app
      - localhost
      - 127.0.0.1
  filesystem:
    write: true
    paths: [".scout"]
  secrets:
    allow: []

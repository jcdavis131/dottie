name: router
version: 0.1.0
description: The Dottie router's training loop. pack turns real production route traces into strict System One (jev-decision-schema-1.0.0) records; train wraps jev-v0's pointer-LoRA trainer (dry-run by default, GPU host for --go); eval scores a checkpoint against the MoMA-lite heuristic on the holdout and computes gate_passed through dottie_loop.evaluation; promote is the separate human stamp. Nothing auto-promotes.
capabilities:
  # No network: pack/eval/promote are local file transforms; train only spawns
  # the jev-v0 trainer as a child process (and only with --go does that child
  # download a base model, on the GPU host).
  network:
    enabled: false
  filesystem:
    # The one plugin-chosen write is the promotion stamp store (gated with
    # fs_write). Everything else goes where the operator points on the command
    # line: the pack --out dir, the train --out checkpoint, the checkpoint's
    # eval_summary.json, or a DOTTIE_ROUTER_STAMPS override (all gated with
    # fs_write_arg, which checks the write flag and stops by design).
    write: true
    paths:
      - "~/.dottie/router/stamps/"
  secrets: false
tags: [router, system-one, training, promotion]

name: inbox
version: 0.5.0
description: Unattended ask inbox — park consequential actions when away, approve/deny later (openworker-style)
capabilities:
  filesystem:
    write: true
    paths: ["~/.local/share/dottie/inbox/"]
  network:
    allow: []
  secrets:
    allow: []
zero_deps: true
atomic: true
perms: "0600"
lifecycle: ["pending", "approved", "denied", "expired"]

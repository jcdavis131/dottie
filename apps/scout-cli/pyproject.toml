[project]
name = "scout-cli"
version = "0.8.0"
description = "Scout CLI - personal control plane (ex-BigBang). Agent-native herd sessions + Ava brain + tools/MCP + authentic writing + RTX offload. HOME-only."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["scout", "cli", "agent", "tools", "mcp", "personal", "automation", "kitty"]
dependencies = [
  # NOT typer[all]: typer 0.15 declares no extras at all, so pip/uv silently drop
  # the `[all]` marker (uv.lock resolved it to plain `typer`). rich ships with
  # typer now and is declared below on its own.
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # <2: mcp 2.x renamed mcp.server.fastmcp.FastMCP and bigbang/plugins/mcp/server.py
  # fails at import on a fresh resolve (mcp==2.1.1, measured 2026-09-05).
  "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
# Only packages bigbang actually imports. gspread / supabase / onnxruntime /
# cryptography were declared here but referenced NOWHERE in the tree, and uv.lock
# was resolving all of it -- including two onnxruntime builds -- for dead entries.
# mcp is a hard dependency above; repeating it in an extra bought nothing.
all = ["keyring"]
dev = ["pytest>=8", "ruff>=0.3", "mypy>=1.8", "pytest-cov"]
# keyring is imported under try/except in core/security.py, so a missing keychain
# backend degrades to the file store instead of crashing.
security = ["keyring"]
# Personal Graphify — install from local private clone: pip install -e ~/personal-graphify
# (dottie monorepo: pip install -e <dottie>/packages/personal-graphify)
graphify = []

[project.urls]
Homepage = "https://github.com/jcdavis131/scout-cli"
Issues = "https://github.com/jcdavis131/scout-cli/issues"

[project.scripts]
scout = "bigbang.cli:app"
bb = "bigbang.cli:app"
bigbang = "bigbang.cli:app"
dv = "bigbang.cli:app"
kitty = "bigbang.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bigbang", "bigbang.*"]

[tool.setuptools.package-data]
bigbang = [
  "skills/*.md",
  "skills/*/SKILL.md",
  "plugins/*/manifest.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "graphify_out*", "results/*", ".mypy_cache", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311","W505","RUF005","B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


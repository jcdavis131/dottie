[project]
name = "jarvisd"
version = "0.1.0"
description = "jarvisd — the always-on Jarvis daemon: MCP (streamable-HTTP + SSE) and JSON API over one SQLite store of memories, claims, inbox, goals and timeline."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["jarvis", "mcp", "daemon", "agents", "sqlite"]
# stdlib + the MCP SDK and the ASGI stack it already pulls in (starlette, uvicorn).
dependencies = [
  # <2: mcp 2.x renamed mcp.server.fastmcp.FastMCP; jarvisd and scout's
  # bigbang/plugins/mcp/server.py both fail at import on 2.1.1 (measured 2026-09-05).
  "mcp>=1.28.1,<2",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Optional Anthropic-backed `jarvis.ask` (spec §6). Without the extra AND
# ANTHROPIC_API_KEY the tool returns a structured "brain unavailable" error.
brain = ["anthropic>=1.0"]
# `contacts.resolve` needs the `acne` package, which is NOT on any index
# (`uv pip install acne` resolves nothing, checked 2026-09-05). Install it as a
# sibling checkout: `pip install -e ~/workspace/acne` — jarvisd also looks for
# `~/workspace/acne/src` on sys.path, mirroring scout's contacts plugin.
dev = ["pytest>=8"]

[project.scripts]
jarvisd = "jarvisd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvisd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311","W505","RUF005","B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["jarvisd","dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# Solo personal project, no connection to employer, built with public/free-tier only
[project]
name = "dottie-assistant"
version = "0.1.0"
description = "Dottie — agentic-assistant platform for the dottie monorepo: CodeAct tasks, trace capture, and the train/eval/iterate flywheel. Solo personal project, no connection to employer, built with public/free-tier only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cam Davis" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]
# torch is deliberately NOT a dependency: the AvaPolicy backend and train_step import it
# lazily and refuse honestly when absent. The ollama/echo backends and the whole
# engine/API run torch-free.

[project.optional-dependencies]
dev = ["pytest>=8"]
ava = ["torch>=2.2", "numpy>=1.24"]

[project.scripts]
dottie = "dottie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit wheel packages — the repo learned this lesson (hatchling cannot infer the
# package when the project name differs from the package dir).
[tool.hatch.build.targets.wheel]
packages = ["dottie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["__pycache__", ".git", ".venv", "graphify_out*", "results/*", ".mypy_cache", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = ["S101","S603","S607","E501","N806","N803","S110","S112","RUF001","RUF002","B007","PTH120","E402","N812","RUF003","S311","W505","RUF005","B008"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dottie","bigbang","skills","harness","personal_graphify"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

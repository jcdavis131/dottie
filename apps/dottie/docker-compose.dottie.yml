# Solo personal project, no connection to employer, built with public/free-tier only
#
# Dottie — agentic-assistant platform service.
#
#   docker compose -f apps/dottie/docker-compose.dottie.yml up --build
#   curl http://localhost:8100/status
#
# extra_hosts maps host.docker.internal to the host gateway so the Ollama server running on
# the user's box (qwen3:32b at :11434) is reachable from inside the container — the same
# convention apps/ava-factory/docker-compose.yml uses for its ava-train service.

services:
  dottie:
    build:
      context: ../..                       # dottie monorepo root
      dockerfile: apps/dottie/Dockerfile
    image: dottie/dottie:latest
    ports:
      - "8100:8100"
    environment:
      DOTTIE_OLLAMA_URL: ${DOTTIE_OLLAMA_URL:-http://host.docker.internal:11434}
      DOTTIE_OLLAMA_MODEL: ${DOTTIE_OLLAMA_MODEL:-qwen3:32b}
      DOTTIE_DATA_DIR: /data
      DOTTIE_WORKERS: ${DOTTIE_WORKERS:-2}
      DOTTIE_QUEUE_MAX: ${DOTTIE_QUEUE_MAX:-32}
      # This service's primary consumer is the arxiviq site tab — tag its
      # session_context writes with the surface (jspace_state KNOWN_CHANNELS).
      DOTTIE_CHANNEL: ${DOTTIE_CHANNEL:-arxiviq}
      # Optional: point at a mounted ava checkpoint to enable the trainee backend
      # (also requires torch in the image — see Dockerfile note).
      DOTTIE_AVA_CKPT: ${DOTTIE_AVA_CKPT:-}
      DOTTIE_ROOT: /dottie
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dottie_data:/data
      # The research workers run on the HOST and own the ledger; the container gets a read-only
      # view so /research/status (and the arxiviq Research tab) renders the real experiment
      # ledger. Read-only by design: the server must never write the host ledger.
      - ./data/research:/data/research:ro
      # Uncomment to expose a host checkpoint tree to the ava backend / train-step:
      # - /path/to/ava-agi-factory-v6-4/runs:/dottie/apps/ava-factory/runs
    restart: unless-stopped

volumes:
  dottie_data:

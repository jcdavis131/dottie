# Solo personal project, no connection to employer, built with public/free-tier only
[project]
name = "hermes-openclaw"
version = "0.1.0"
description = "Hermes (codename openclaw) — agentic-assistant platform for the dottie monorepo: CodeAct tasks, trace capture, and the train/eval/iterate flywheel. Solo personal project, no connection to employer, built with public/free-tier only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Cam Davis" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]
# torch is deliberately NOT a dependency: the AvaPolicy backend and train_step import it
# lazily and refuse honestly when absent. The ollama/echo backends and the whole
# engine/API run torch-free.

[project.optional-dependencies]
dev = ["pytest>=8"]
ava = ["torch>=2.2", "numpy>=1.24"]

[project.scripts]
hermes = "hermes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit wheel packages — the repo learned this lesson (hatchling cannot infer the
# package when the project name differs from the package dir).
[tool.hatch.build.targets.wheel]
packages = ["hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

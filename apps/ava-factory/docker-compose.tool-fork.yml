# One-shot override: mini tool fork from base_final (T9.3 gate).
#   docker compose -f docker-compose.yml -f docker-compose.tool-fork.yml up -d trainer
#
# Do NOT use --resume. Writes under /ckpt/tool/ (tool_final.pt).
# Host bind-mounts pick up local ava/ + configs/ without a full image rebuild.
services:
  trainer:
    environment:
      AVA_MAX_MICRO_BATCH: "4"   # fp32 fits in 12GB at mb 4; accum doubles, tokens/step unchanged
    command:
      - python
      - -m
      - dottie.train
      - --preset
      - mini
      - --branch
      - tool
      - --init
      - /ckpt/base_final.pt
      - --run
      - /ckpt/tool
      # --resume: crash-safe continuation from /ckpt/tool/latest. Two live crashes
      # tonight (GPU contention, then CUBLAS_STATUS_INTERNAL_ERROR on this WSL2
      # stack) each restarted the fork from step 0 — an 11h run can never finish
      # that way. On a FRESH fork /ckpt/tool has no latest and this is a no-op.
      - --resume
    volumes:
      - ava_packed:/packed
      - ava_ckpt:/ckpt
      - ava_state:/state
      - ava_reports:/reports
      - type: bind
        source: .
        target: /app
      - type: bind
        source: C:/
        target: /host_disk
        read_only: true

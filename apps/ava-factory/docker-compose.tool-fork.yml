# One-shot override: mini tool fork from base_final (T9.3 gate).
#   docker compose -f docker-compose.yml -f docker-compose.tool-fork.yml up -d trainer
#
# Do NOT use --resume. Writes under /ckpt/tool/ (tool_final.pt).
# Host bind-mounts pick up local ava/ + configs/ without a full image rebuild.
services:
  trainer:
    command:
      - python
      - -m
      - dottie.train
      - --preset
      - mini
      - --branch
      - tool
      - --init
      - /ckpt/base_final.pt
      - --run
      - /ckpt/tool
      # --resume: crash-safe continuation from /ckpt/tool/latest. Two live crashes
      # tonight (GPU contention, then CUBLAS_STATUS_INTERNAL_ERROR on this WSL2
      # stack) each restarted the fork from step 0 — an 11h run can never finish
      # that way. On a FRESH fork /ckpt/tool has no latest and this is a no-op.
      - --resume
    environment:
      # p4 seq-4096 crash-loop relief (2026-07-22): mb 2 -> 1 halves activation
      # memory; identical training math via accum 64 (same 262144 tok/step).
      # Evidence: restarts=3 — CUDA unknown-error at the p3->p4 boundary, then
      # ~40 min of healthy p4 steps, then CUDA OOM at mb 2 on this 12GB WSL2
      # stack (fragmentation + 2GB checkpoint writes spike past the ~10.2GB
      # working set). Merges with the base service env (compose map merge).
      AVA_MAX_MICRO_BATCH: "1"
    volumes:
      - ava_packed:/packed
      - ava_ckpt:/ckpt
      - ava_state:/state
      - ava_reports:/reports
      - type: bind
        source: .
        target: /app
      - type: bind
        source: C:/
        target: /host_disk
        read_only: true

  # Curriculum deploy (2026-07-21): bind-mount local (merged) configs + datagen into the
  # collector so the new sources (scout_cli, zk_math, compression, db_trace) go live WITHOUT
  # a memory-heavy image rebuild — same `. -> /app` pattern the trainer uses above. Volumes
  # replicate the base collector's named volumes (ava_raw/state/reports) so the cursor + RAW
  # output are preserved across recreate. Recreate with `--scale collector=2` to avoid
  # resurrecting the operator-stopped collector-3/4.
  collector:
    volumes:
      - ava_raw:/raw
      - ava_state:/state
      - ava_reports:/reports
      - type: bind
        source: .
        target: /app
      - type: bind
        source: C:/
        target: /host_disk
        read_only: true

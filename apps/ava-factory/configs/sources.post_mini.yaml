# =============================================================================
# POST-MINI mixture — apply AFTER mini base_final (Spec 15).
# Live collectors must keep using sources.yaml until then.
# Apply: python scripts/apply_post_mini_sources.py
# =============================================================================
# Source registry for the Ava collector.
#
# Maps HuggingFace datasets and local synthetic generators onto the 6-phase
# curriculum. The collector reads this file, and for a target phase selects a
# source by mixture `weight` (smooth weighted round-robin). Within any single
# phase the source weights sum to ~1.0 -- that sum is the mixture for the phase.
#
# Curriculum (see PLAN.md). Agentic/tool-use (react_tools) runs through
# P2/P3/P5 so the harness ecosystem — tools, skills, observations — is
# curriculum material from the foundation phase onward, not an SFT bolt-on:
#   P0 logic       : synthetic only
#   P1 math        : open-web-math (light) + synthetic math
#   P2 foundation  : fineweb-edu (edu>=2) + github-code + cosmopedia + synthetic facts + react skills
#   P3 reasoning   : proof-pile-2 + open-web-math + synthetic CoT/temporal + react tool-use + synthetic workflows
#   P4 long        : fineweb-edu (long docs) + synthetic needle-in-haystack + synthetic workflows
#   P5 anneal      : fineweb-edu (edu>=4.5) + proof-pile-2 (verified) + synthetic safety + react grounding + workflows
#
# Every `dataset` + `config` pair below was verified against the HF API to exist
# and to be `gated:false` before being committed here. Changing a config name
# without re-verifying will make the collector fail at runtime.
#
# Fields per entry:
#   name        stable id; also the doc_id prefix and the /raw/<name>/ dir
#   kind        hf | synthetic
#   dataset     HF dataset id (hf only)
#   config      HF config/name (hf only; null if the dataset has none)
#   split       HF split (hf only)
#   text_field  record key holding the training text
#   score_field record key holding a quality score (hf only; optional)
#   generator   synthetic generator id (synthetic only)
#   trust_remote_code  true for script-based HF datasets (proof-pile-2, github-code)
#   phases      curriculum phases this source feeds
#   weight      {phase: mixture_weight} -- per phase, weights across sources sum ~1.0
#   task_type   automatic | deliberate | safety | temporal | tool_selection
#   adapter     optional HF→ReAct transform key (ava.datagen.adapters.ADAPTERS)
#   filters     min_chars (int or {phase:int}), min_edu_score ({phase:float} on score_field)
#   license / gated  provenance

sources:
  # ---- synthetic generators (no network; deterministic per doc index) --------
  - name: synth_logic
    kind: synthetic
    generator: logic
    text_field: text
    phases: [0]
    weight: {0: 1.0}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  - name: synth_math
    kind: synthetic
    generator: math
    text_field: text
    phases: [1]
    weight: {1: 0.5}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  - name: synth_facts
    kind: synthetic
    generator: ency
    text_field: text
    phases: [2]
    weight: {2: 0.15}
    task_type: automatic
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # MathGenerator covers phases 1/3/4; phase decides which curriculum it emits.
  - name: synth_code
    kind: synthetic
    generator: code
    text_field: text
    phases: [2]
    weight: {2: 0.10}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # SynPro-lite (faithful organic rephrase). Weight 0 until enabled.
  - name: synth_synpro
    kind: synthetic
    generator: synpro
    text_field: text
    phases: [2, 3]
    weight: {2: 0.0, 3: 0.0}
    task_type: automatic
    filters: {min_chars: 1}
    license: synthetic
    gated: true

  # Think-in-code (reason→exec→answer). Boosted while proof_pile_2 is quarantined.
  - name: synth_think_code
    kind: synthetic
    generator: think_code
    text_field: text
    phases: [3, 5]
    weight: {3: 0.15, 5: 0.15}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # LLM-VM tool schedules (weight 0 here too until operator flip with L5).
  - name: synth_think_tools
    kind: synthetic
    generator: think_tools
    text_field: text
    phases: [3, 4, 5]
    weight: {3: 0.0, 4: 0.0, 5: 0.0}
    task_type: tool_selection
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  - name: synth_cot
    kind: synthetic
    generator: math
    text_field: text
    phases: [3]
    weight: {3: 0.15}
    task_type: temporal
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # Long-context / needle-in-haystack docs come from EncyclopediaGenerator (p4),
  # not MathGenerator -- verified by inspecting the phases each actually emits.
  - name: synth_needle
    kind: synthetic
    generator: ency
    text_field: text
    phases: [4]
    weight: {4: 0.20}
    task_type: automatic
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  - name: synth_safety
    kind: synthetic
    generator: chat
    text_field: text
    phases: [5]
    weight: {5: 0.15}
    task_type: safety
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # Agentic workflows / tool usage / skills (Thought:/Action:/Observation:).
  # P2 = skill leverage as foundation vocabulary; P3 = tool calls and
  # multi-step workflows; P5 = grounding-heavy anneal (notfound + cite).
  - name: synth_react
    kind: synthetic
    generator: react_tools
    text_field: text
    phases: [2, 3, 5]
    weight: {2: 0.07, 3: 0.15, 5: 0.18}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # Tool-use curriculum (spec 15 §4) — the deliberate successor to synth_react:
  # a 5-level ladder (grounded single -> multi-step chain -> error recovery ->
  # tool selection among many -> negative/refuse) + P4 search/cite, same
  # frozen-tokenizer-safe plain-text ReAct format.
  #
  # ACTIVE here (post-mini). Live mini still uses sources.yaml at weight 0.
  - name: synth_tool_use
    kind: synthetic
    generator: tool_use
    text_field: text
    phases: [2, 3, 4, 5]
    weight: {2: 0.08, 3: 0.15, 4: 0.10, 5: 0.12}
    task_type: tool_selection
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # Interlinked LLM-wiki corpora (Karpathy wiki pattern: entity/concept pages,
  # index.md, log.md, [[cross-links]]; every number computed -- Kepler periods,
  # equilibrium temperatures, aggregates). Text-first today; the same pages
  # render deterministically into 512x512 page images via
  # ava/pipeline/pxpipe.py for the optical-compression training arm
  # (specs/12_pxpipe_optical_wiki.md), so (screenshot, text) pairs are derived
  # at train time and never stored. Weights below were shaved off the largest
  # same-phase sibling (fineweb_edu p2 0.35->0.30, open_web_math p3
  # 0.20->0.15, fineweb_edu p4 0.55->0.45) so each phase still sums to 1.0.
  - name: synth_wiki_px
    kind: synthetic
    generator: wiki
    text_field: text
    phases: [2, 3, 4]
    weight: {2: 0.05, 3: 0.05, 4: 0.10}
    task_type: automatic
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # JobBench-style delegation dossiers (occupation x reconciliation task) and
  # Gaia2-style async/dynamic scheduling scenarios -- see
  # ava/datagen/workflow_jobbench.py and workflow_gaia2.py. Weights follow the
  # blueprint's own p3/p4/p5 emphasis (inner_monologue_research.md): jobbench
  # skews toward reasoning (p3), gaia2 skews toward long/async context (p4).
  # Existing p3/p4/p5 source weights above were rescaled down proportionally
  # to make room for BOTH this and synth_react so each phase still sums to
  # ~1.0 (the two source PRs were authored independently of each other).
  - name: synth_jobbench
    kind: synthetic
    generator: jobbench
    text_field: text
    phases: [3, 4, 5]
    weight: {3: 0.07, 4: 0.10, 5: 0.05}
    task_type: deliberate
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  - name: synth_gaia2
    kind: synthetic
    generator: gaia2
    text_field: text
    phases: [3, 4, 5]
    weight: {3: 0.03, 4: 0.15, 5: 0.10}
    task_type: temporal
    filters: {min_chars: 1}
    license: synthetic
    gated: false

  # ---- HuggingFace streaming sources -----------------------------------------
  - name: open_web_math
    kind: hf
    dataset: open-web-math/open-web-math
    config: default
    split: train
    text_field: text
    phases: [1, 3]
    weight: {1: 0.5, 3: 0.25}   # +0.10 from quarantined proof_pile_2
    task_type: deliberate
    filters: {min_chars: 200}
    license: odc-by
    gated: false

  - name: fineweb_edu
    kind: hf
    dataset: HuggingFaceFW/fineweb-edu
    config: sample-10BT
    split: train
    text_field: text
    score_field: score
    phases: [2, 4, 5]
    weight: {2: 0.30, 4: 0.35, 5: 0.25}   # post-mini: freed mass for synth_tool_use P4/P5
    task_type: automatic
    filters:
      min_chars: {2: 200, 4: 4000, 5: 200}   # P4 = long documents only
      min_edu_score: {2: 2.0, 5: 4.5}         # P5 anneal = highest quality only
    license: odc-by
    gated: false

  - name: github_code
    kind: hf
    dataset: codeparrot/github-code
    config: Python-mit
    split: train
    text_field: code
    trust_remote_code: true
    phases: [2]
    weight: {2: 0.15}
    task_type: automatic
    filters: {min_chars: 200}
    license: mit
    gated: false

  - name: cosmopedia
    kind: hf
    dataset: HuggingFaceTB/cosmopedia
    config: web_samples_v2
    split: train
    text_field: text
    phases: [2]
    weight: {2: 0.10}
    task_type: automatic
    filters: {min_chars: 200}
    license: apache-2.0
    gated: false

  # QUARANTINED 2026-07-15: HF zstd stream throws "Unknown frame descriptor"
  # (burns collector retries). Weights parked at 0; mass moved to think_code /
  # open_web_math / fineweb_edu / react until a working mirror or decode path.
  - name: proof_pile_2
    kind: hf
    dataset: EleutherAI/proof-pile-2
    config: arxiv
    split: train
    text_field: text
    trust_remote_code: true
    phases: [3, 5]
    weight: {3: 0.0, 5: 0.0}
    task_type: deliberate
    filters: {min_chars: 200}
    license: various
    gated: true

  # xLAM / APIGen 60k → ReAct (adapter). Weight 0 until post-mini / overtrain
  # operator flip; suggested start once activated: {3: 0.05, 5: 0.05}.
  - name: xlam_react
    kind: hf
    dataset: Salesforce/xlam-function-calling-60k
    config: dataset
    split: train
    text_field: text
    adapter: xlam_react
    phases: [3, 5]
    weight: {3: 0.0, 5: 0.0}
    task_type: tool_selection
    filters: {min_chars: 1}
    license: cc-by-4.0
    gated: false

  # Pass-only SWE-smith trajectories → fixed catalog ReAct. Weight 0 until
  # activated; filter resolved=true is enforced inside adapter: swe_react.
  # Suggested start: {3: 0.05, 4: 0.05, 5: 0.05} (cap ≤10% phase).
  - name: swe_traj_react
    kind: hf
    dataset: SWE-bench/SWE-smith-trajectories
    config: default
    split: tool
    text_field: text
    adapter: swe_react
    phases: [3, 4, 5]
    weight: {3: 0.0, 4: 0.0, 5: 0.0}
    task_type: tool_selection
    filters: {min_chars: 1}
    license: mit
    gated: false

  # ---- smoke-test source (small, fast, ungated) ------------------------------
  - name: tinystories
    kind: hf
    dataset: roneneldan/TinyStories
    config: default
    split: train
    text_field: text
    phases: [2]
    weight: {2: 0.0}          # 0 mixture weight: never auto-selected, --once only
    task_type: automatic
    filters: {min_chars: 1}
    license: cdla-sharing-1.0
    gated: false

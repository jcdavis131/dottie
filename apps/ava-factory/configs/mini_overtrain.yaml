# ava-mini_overtrain — same ~171M arch as mini, T2T-length unique-token budget.
# Live mini (~2.5B) finishes ≈14.6 TPP (still under Chinchilla~20 / T2T~40).
# This successor targets ~40 TPP ≈ 6.85B tokens. Do NOT attach to the live
# trainer mid-run — start a new GO after mini completes.
preset: mini_overtrain

model:
  vocab_size: 32000
  d_model: 768
  n_heads: 12
  head_dim: 64
  mlp: swiglu
  mlp_ratio: 4.0
  n_text_layers: 3
  n_fusion_layers: 6
  n_reasoning_layers: 3
  tie_lm_head: true
  tie_verbalizer: true
  multimodal: false
  qk_norm: true
  rope_base_init: 10000

jspace:
  slots:      {system1: 32, system2: 64, critic: 16, planner: 32}
  half_life:  {system1: 8, system2: 300, critic: 30, planner: 150}
  hl_weight:  {system1: 0.6, system2: 0.8, critic: 1.0, planner: 0.7}
  broadcast_target: {system1: 0.18, system2: 0.22, critic: 0.20, planner: 0.20}
  s2_verbalizable_mass: 0.065
  critic_vm: 0.08
  inter_mi_cos_target: 0.45
  inter_mi_weight: 0.3
  routing_weight: 0.4
  routing_targets:
    automatic:      [0.60, 0.15, 0.10, 0.15]
    deliberate:     [0.15, 0.55, 0.10, 0.20]
    safety:         [0.10, 0.20, 0.60, 0.10]
    temporal:       [0.10, 0.30, 0.10, 0.50]
    tool_selection: [0.10, 0.35, 0.10, 0.45]
  base_loss_weights: {report: 1.0, broadcast: 0.5, selectivity: 0.3, modulation: 0.5}
  j_weight: {early: 0.08, late: 0.15}

training:
  device: cuda
  precision: bf16
  compile: false
  tokens_total: 6_850_000_000
  tokens_per_step: 262_144
  gradient_checkpointing: true
  # Data-constrained / multi-epoch path: higher WD when synth re-use rises.
  optimizer:
    name: adamw
    betas: [0.9, 0.95]
    weight_decay: 0.1
    weight_decay_data_constrained: 0.5
    grad_clip: 1.0
  wsd: {warmup_steps: 500, stable_frac: 0.92, lr_max: 6.0e-4, lr_min: 6.0e-5}
  checkpoint_every_steps: 50
  metrics_every_steps: 10
  tokens_per_param_target: 40.0

phases:                            # mini proportions × ~2.74 (2.5B → 6.85B)
  - {name: p0_logic,      tokens: 1_096_000_000, seq: 512,  rope_base: 10000,  ntk: 1.0, mix: {logic: 1.0}}
  - {name: p1_math,       tokens: 1_370_000_000, seq: 512,  rope_base: 10000,  ntk: 1.0, mix: {math: 0.85, logic: 0.15}}
  - {name: p2_foundation, tokens: 2_329_000_000, seq: 1024, rope_base: 10000,  ntk: 1.0, mix: {encyclopedia: 0.30, code: 0.20, tool_use: 0.15, math: 0.15, logic: 0.10, chat: 0.10}}
  - {name: p3_reasoning,  tokens: 1_096_000_000, seq: 2048, rope_base: 50000,  ntk: 1.0, mix: {math_reasoning: 0.30, tool_use: 0.30, logic: 0.15, temporal: 0.15, code: 0.10}}
  - {name: p4_long,       tokens: 411_000_000,   seq: 4096, rope_base: 100000, ntk: 1.2, mix: {long_docs: 0.70, needle: 0.30}}
  - {name: p5_anneal,     tokens: 548_000_000,   seq: 4096, rope_base: 100000, ntk: 1.2, mix: {tool_use: 0.25, proofs_verified: 0.20, chat: 0.20, safety: 0.20, math_reasoning: 0.15}}

data:
  seed: 1234
  raw_dir: data/mini_overtrain/raw
  packed_dir: data/mini_overtrain/packed
  heldout_tokens_per_phase: 2_000_000
  tokenizer_path: data/mini/tokenizer/ava_bpe_32k.json

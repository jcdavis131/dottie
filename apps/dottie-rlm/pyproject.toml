[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dottie-rlm"
version = "0.1.0"
description = "Prime-Agent-style RLM harness: one tool (a persistent IPython kernel); everything else is a function call inside it."
readme = "SPEC.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cameron Davis", email = "jcdavis131@gmail.com" }]
keywords = ["rlm", "agent", "harness", "ipython", "dottie"]
dependencies = [
  # NOT typer[all]: typer 0.15 declares no extras, so pip/uv silently drop
  # the [all] marker (same lesson as scout-cli's pyproject).
  "ipython>=8.10",
  "typer>=0.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dottie-rlm = "dottie_rlm.cli:app"

[tool.setuptools]
packages = ["dottie_rlm"]

# NOTE: no addopts=-q here on purpose — it stacks with a command-line -q into
# -qq, which suppresses the pass/fail summary line entirely (a silently-green
# footgun on timeout-killed runs). Capture EXIT=$? instead.
[tool.pytest.ini_options]
testpaths = ["tests"]

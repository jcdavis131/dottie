name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because scripts/test_retrieval_eval.py mines pairs from the REAL
      # git history. actions/checkout defaults to a depth-1 shallow clone, so on the first
      # CI run of that suite (1a9a2a3) it found 0 pairs and died with IndexError — a
      # genuine environment difference, not a flake.
      #
      # Deliberately NOT "fixed" by having the test skip when history is missing. That
      # would make it pass in CI by checking nothing, which is the vacuous-green shape this
      # repo keeps finding and this very suite exists to prevent. Give it real history
      # instead. Cost is small and was measured before choosing: 926 commits, 39 MB .git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.11
      # WAS: `uv sync --all-groups --frozen || uv sync`. The `--frozen` flag exists to
      # ASSERT that uv.lock still satisfies pyproject.toml; the fallback then discarded
      # that assertion and re-resolved. Net effect: add a dependency, forget to re-lock,
      # and CI goes green anyway — while testing against a dependency set that is NOT the
      # one uv.lock pins, so "it passed CI" stops implying "it passes from the lockfile".
      # A strict check followed by a lax retry of the same command is the strict check
      # deleted, just spelled in a way that reads like resilience.
      #
      # Verified safe to harden 2026-08-01: `uv lock --check` exits 0 at this commit, so
      # this fails today only if the lockfile genuinely drifts. When it does fail, the fix
      # is `uv lock` and commit uv.lock — do not restore the fallback.
      #
      # gate_audit does not flag this: shape B matches `|| true` and `|| :`, not
      # `|| <some other command>`, and broadening it there would flag every legitimate
      # fallback — a detector that cries wolf is how the tool earns its own `|| true`.
      - name: Sync workspace (light packages, lockfile must be current)
        run: uv sync --all-groups --frozen
      # packages/ava-skills REACHED 0 on 2026-08-01, so per the ratchet plan recorded
      # here on 2026-07-24 ("Flip to a hard gate per package as each reaches 0 ... do
      # NOT flip all four at once") it is now a HARD gate and is no longer part of the
      # non-blocking run below. 19 findings closed: 17 by `ruff --fix` (UP006/UP045
      # annotation modernisation), plus one `os.path.isdir` -> `Path.is_dir` and two
      # read-only test fixtures correctly annotated `ClassVar` rather than suppressed.
      # 89 ava-skills tests green at 0 findings. (Was written as "75" — the NARROWED
      # `pytest .../tests` count the gate comment below explicitly warns against.)
      # `uvx ruff@0.15.22`, NOT `uv run ruff`. ruff is not a workspace dependency, so
      # `uv run ruff` dies with "Failed to spawn: ruff" (exit 2) — which the old
      # `|| true` swallowed, meaning NEITHER ruff step in this workflow had ever
      # actually executed. The "334 known findings" the comment below cited were
      # measured on a dev box; THIS workflow was reporting on a linter it never ran.
      # Correction to an earlier overstatement (61b922e said "CI has never once run the
      # linter"): the SEPARATE lint.yml workflow HAS been running ruff correctly the
      # whole time — it `pip install ruff==0.15.22` first, and its logs show a real
      # "Found 263 errors". Only ci.yml's two steps were the silent no-op. Flipping
      # ava-skills to a hard gate on 2026-08-01 is what surfaced it, by removing the
      # `|| true` that was hiding it. Version is PINNED and matches lint.yml, per that
      # workflow's own hard-won note: "ONE ruff version across both workflows" — a
      # 0.8.6/0.15.22 split there once made "ruff clean locally" not predict CI at all.
      - name: Ruff lint — packages/ava-skills (HARD gate, at 0)
        run: uvx ruff@0.15.22 check packages/ava-skills
      # NON-BLOCKING for the REMAINING three, and the size of the debt is stated so
      # `|| true` cannot be mistaken for "lint is clean". Re-measured 2026-08-01:
      # 252 findings -- packages/personal-graphify 141, packages/ava-open-harness 79,
      # apps/scout-cli 32 (each package carries its own [tool.ruff], and the
      # per-package counts sum exactly to the combined run, so this is real debt and
      # not a config-discovery artifact).
      # Trail: 334 across four packages on 07-24 -> 263 -> 252. scout-cli 95 -> 43 -> 32
      # and ava-skills 19 -> 0. Same ratchet: flip the next one the day it reaches 0.
      # The 263 -> 252 step is worth noting as a caution, not a triumph: it was written
      # as "263" earlier the SAME DAY and went stale hours later when the scout-cli
      # security review closed 11 findings. A number in a comment rots even inside one
      # session — re-measure it, never carry it forward.
      - name: Ruff lint (non-blocking — 252 known findings, see comment)
        run: uvx ruff@0.15.22 check packages/ava-open-harness packages/personal-graphify apps/scout-cli --exclude apps/scout-cli/.venv || true
      # A RATCHET, not a lint. Fails only on a gate-shaped defect (fail-open dispatch,
      # mode-conditional escape, suppressed check) that is NOT already in the baseline;
      # the 9 currently there each carry a written judgment. So this cannot go red on
      # the known false positives -- which matters, because a gate that cries wolf gets
      # `|| true`'d, and that is literally instance #5 in gate_audit.py's own docstring.
      # Plain `gate_audit.py` still exits 0 always, exactly as its docstring promises;
      # --check is a separate opt-in contract and this step is the thing that opts in.
      # Without this step the auditor was itself "a gate whose verdict nothing
      # consumes" -- the defect class it exists to find. stdlib only, so no uv sync dep.
      - name: Gate audit (ratchet — new fail-open patterns only)
        run: uv run python scripts/gate_audit.py --check --baseline scripts/gate_audit_baseline.json
      # Companion ratchet, added the day after the checker itself (e5b84ba). Building a
      # ratchet and running it nowhere would have made it instance #6 of the very class it
      # detects — gate_audit sat unrun for months for exactly that reason until 7398a46.
      #
      # 47 plugins declare capabilities.filesystem.paths, 34 enforce it, 13 do not. Those
      # 13 are baselined WITH judgements, so this cannot go red on known debt; it fails
      # only when a NEW plugin declares a filesystem restriction and never calls
      # enforce_or_raise. That 47 is the same 47 in gate_audit.py's docstring, instance #2
      # ("declared by 47 of 56 manifests, enforced by 0") — so this closes the ratchet on a
      # gap that went 0 -> 34 and then stalled.
      #
      # Needs pyyaml, which the workspace sync already provides. The checker refuses to
      # report clean when it finds zero declaring plugins or a missing baseline, so a
      # broken parse fails loudly instead of passing vacuously.
      - name: Declared-capability ratchet (no new declare-without-enforce)
        run: uv run python scripts/check_declared_capabilities.py --check --baseline scripts/declared_capabilities_baseline.json
      # scripts/ has 222 tests that ran NOWHERE until 2026-08-01 — not in this workflow,
      # not in a Makefile target. Found while checking whether the ratchet above would be
      # the only unrun thing I had added; it was not, and the tests guarding the ratchets
      # themselves were the ones missing. gate_audit exists to find gates nobody consumes,
      # and its own 53 tests were never executed.
      #
      # They are SELF-RUNNING scripts (a `check()` helper, then `sys.exit(1 if FAIL)`), not
      # pytest modules — running them under pytest gives "no tests ran" plus a SystemExit
      # INTERNALERROR, because the module-level exit fires during collection. So each is
      # invoked directly, and `set -e` fails the step on the first non-zero exit.
      #
      # EXPECT NOISE ON STDERR, and do not read it as a failure. test_task_eval_slice.py
      # deliberately drives task_eval_slice's abort path, so the step log contains
      # "ABORT: item accounting does not balance: {...}" while the script exits 0. That is
      # the guard being exercised (see its own tests: "main: refuses to report, rc=3, when
      # item accounting does not balance"), not the guard firing for real.
      #
      # Verified under `uv run` (this workflow's env), not just ambient python:
      #   test_gate_audit                  53 passed
      #   test_retrieval_eval              35 passed
      #   test_task_eval_slice            134 passed
      #   test_check_declared_capabilities  19 passed  (new, guards the ratchet above)
      #   test_store_symmetry_audit         19 passed  (new, guards the audit below)
      #
      # test_store_symmetry_audit ALSO needs the full history that fetch-depth: 0 provides:
      # it verifies the audit's embedded fixture is still verbatim from a2ccea5^, so an
      # edited fixture cannot quietly turn that detector into theatre.
      - name: Scripts self-tests (260 tests, 241 of which previously ran nowhere)
        run: |
          set -e
          uv run python scripts/test_gate_audit.py
          uv run python scripts/test_retrieval_eval.py
          uv run python scripts/test_task_eval_slice.py
          uv run python scripts/test_check_declared_capabilities.py
          uv run python scripts/test_store_symmetry_audit.py
      # Mutations that clear one store and leave another holding the value. Found in
      # bigbang/core/security.py 2026-08-02 (fixed a2ccea5): delete_secret cleared the
      # file vault and returned, so the keyring copy the READ path consults first was
      # reached only when the file missed -- deletion reported success while the
      # credential stayed readable.
      #
      # Gates without a baseline, unlike gate_audit.py. Affordable because the shape is
      # rare: 0 hits across 1293 files when it was written, so the first hit is worth a
      # human read rather than a triage queue. --check runs a self-test against the real
      # pre-fix function BEFORE scanning and exits 2 if the detector has gone blind, so a
      # refactor cannot turn this green by breaking it.
      - name: Store-symmetry audit (partial deletes that report success)
        run: uv run python scripts/store_symmetry_audit.py --check
      # No clock time claimed in a TODO.md `5.3.R<N>` entry may postdate HEAD.
      #
      # Wired into CI 2026-08-02 because README-only enforcement demonstrably failed. The
      # script was written 2026-07-20 against a root TODOS.md; 41534f2 merged that file
      # into TODO.md on 07-26 and the path was never updated, so for six days every
      # invocation died with FileNotFoundError before checking anything — while
      # scripts/README.md called it "Ops discipline 9.5, run it on any tick that writes
      # TODOS". It broke silently precisely because nothing ran it.
      #
      # Needs the fetch-depth: 0 history above: it maps each entry to the commit that
      # names it. Both no-file and no-entries now exit 2 rather than reporting OK on an
      # empty scan.
      - name: TODO timestamps (no claimed time postdates HEAD)
        run: uv run python scripts/check_todos_timestamps.py
      # The lint-debt figure written in BOTH workflows, verified against a fresh ruff
      # run. Added 2026-08-01 after ~15 stale numbers were corrected by hand in one
      # session — including this very figure, which was written as 263 and went stale
      # HOURS later when a commit closed 11 findings. Hand re-measurement demonstrably
      # cannot keep up; a ruff count is exactly reproducible, so it is checked instead.
      # Narrow on purpose: no prose, no test counts, no timings — a check that cries
      # wolf gets `|| true`'d, which is instance #5 in gate_audit.py's own docstring.
      # KNOWN COST: it fires in both directions, so a lint CLEANUP also reds the build
      # until the figure is updated. Deliberate — a figure that is too low misleads just
      # as much, and "it only drifted the good way" is how 286 -> 263 -> 252 slipped by
      # three times. Fix is a one-line edit; the failure prints the value to paste. If
      # this friction ever outweighs the rot, drop --check and keep the report mode —
      # do NOT add a tolerance band, which would restore the silent drift.
      - name: Documented counts (lint debt still reproduces)
        run: uv run python scripts/check_documented_counts.py --check
      # scout-cli is a HARD gate. It holds the openswap family, its board is green,
      # and a `|| true` here would mean the GOAT audit's test-honesty dimension
      # scores suites that CI is contractually unable to fail. No `|| true`.
      # working-directory is load-bearing, not tidiness. Run from the repo root and
      # `import bigbang` can resolve to a DIFFERENT scout-cli checkout: on the dev
      # box an `__editable__.scout_cli-0.7.0.pth` finder points at ~/scout-cli, so a
      # root-level run silently tested stale 0.7.0 code and reported 8 failures that
      # do not exist in this tree. Running from apps/scout-cli puts cwd first, which
      # is the invocation measured green, so the gate asserts what was actually
      # verified rather than whatever the resolver happens to pick.
      # Count re-read from this gate's own CI log 2026-08-02: **2316 passed, 1 skipped**
      # in 7m53s. This figure has now been stale twice — it read 1156 (off by ~2x), was
      # corrected to 2260 on 08-01, and went stale again within a day. A load-bearing
      # rationale loses its force when its number does not reproduce, so it is taken from
      # `gh run view --log` on this gate, never from a dev-box run.
      #
      # The snapshot/diff pair around this step is the state-pollution gate. This suite is
      # the one with the history: running it from the REPO ROOT (which the Makefile used
      # to do) made a forge test scaffold a real plugin into bigbang/plugins/gentest/,
      # which showed up as +21 ruff findings and a documented-count failure before anyone
      # looked at the directory. Source-tree pollution survives into commits.
      #
      # Wrapped around ONE suite on purpose rather than around all of them. A diff spanning
      # every suite would still fail the build but could not say which one did it, and a
      # gate that cannot name the culprit gets muted. Snapshot is ~1.1 s over 8,329 files
      # locally, so the placement costs nothing.
      #
      # Most REPO_ROOTS (reports/, runs/, ckpt/, data/) are gitignored and absent on a
      # fresh checkout. That does NOT blind this: the sweep skips missing roots when
      # snapshotting, so a suite CREATING one shows up as ADDED in the after-snapshot.
      # The tracked source tree (bigbang/plugins) exists either way, which is the case
      # that actually bit.
      #
      # --diff already refuses to pass on an empty snapshot ("a clean diff here would be
      # vacuous"), so this cannot go green by measuring nothing.
      # The env dump is diagnostic, not decoration. The gate's first run (40044b1) caught
      # the suite creating ~/.config/bigbang/policy.yaml, and narrowing WHY cost a full
      # cycle because the runner's env was invisible from here: user_policy_file() resolves
      # BIGBANG_POLICY_FILE -> XDG_CONFIG_HOME -> Path.home(), and only the last is what
      # tests/conftest.py redirects. Printing the three inputs and the resolved path makes
      # the next failure self-explaining.
      - name: State snapshot (before the suite that has polluted before)
        run: |
          set -e
          echo "HOME=$HOME  XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}  BIGBANG_POLICY_FILE=${BIGBANG_POLICY_FILE:-<unset>}"
          uv run python scripts/state_pollution_sweep.py --snapshot "$RUNNER_TEMP/state-before.json"
      - name: Pytest scout-cli (hard gate)
        working-directory: apps/scout-cli
        run: uv run pytest tests -q
      - name: State pollution (the suite must not write real state)
        run: |
          set -e
          uv run python scripts/state_pollution_sweep.py --snapshot "$RUNNER_TEMP/state-after.json"
          uv run python scripts/state_pollution_sweep.py --diff "$RUNNER_TEMP/state-before.json" "$RUNNER_TEMP/state-after.json"

      # ava-skills is GREEN, so it gates. It was previously lumped in with the
      # harness behind one `|| true`, which is how a passing suite ends up carrying
      # a broken one's exemption. Measured 2026-07-24 with THIS exact command, and
      # also as `python -m pytest` from the repo root and from packages/ava-skills:
      # 80 passed, ~15s, all three agreeing. Re-measured 2026-08-01: **89 passed**,
      # ~13s (both figures drifted +9 as tests were added; the invariant below held).
      #
      # DO NOT "tidy" this into `pytest packages/ava-skills/tests`. That collects
      # ~15 FEWER -- ava-skills declares testpaths = ["skills","tests"] and part of its
      # suite lives under skills/, so narrowing to tests/ silently drops them and still
      # exits 0. Measured both ways 2026-07-24: tests/ = 66 vs this form = 80.
      # Re-measured 2026-08-01: tests/ = **75** vs this form = **89**. The gap is the
      # point, not the absolute numbers.
      # Passing the package DIRECTORY (or running bare from inside it) is what keeps
      # skills/ in scope.
      - name: Pytest ava-skills (hard gate)
        run: uv run pytest packages/ava-skills -q

      # ADDED 2026-08-01. This package was already LINTED by the ruff steps above but
      # its 72 tests had never run in CI -- an asymmetry with no comment anywhere
      # explaining it, so an oversight rather than a decision. Gating rather than
      # soft-adding, per the same rule ava-skills follows: it is GREEN, so it gates.
      # Checked before wiring it, not after: 72 passed in 8.78s via this exact
      # invocation from the repo root, and the suite is robust to missing extras --
      # ollama, tree_sitter and fastapi are all ABSENT from the uv env it ran in, and
      # the one test that needs numpy guards itself with pytest.importorskip. So a
      # leaner CI runner cannot turn this red for a reason unrelated to the code.
      - name: Pytest personal-graphify (hard gate)
        run: uv run pytest packages/personal-graphify -q

      # NON-BLOCKING ON PURPOSE, with the reason named instead of hidden behind a
      # bare `|| true` that reads as "these pass". ava-open-harness fails 5 tests in
      # tests/test_dottie_assistant.py because TWO importable packages are named
      # `dottie`: `dottie.rl` exists only in apps/ava-factory/dottie (FROZEN --
      # bind-mounted into the live trainer) while dottie.engine/policy/tasks/resolve
      # exist only in apps/dottie/dottie. The harness needs submodules from both, so
      # NO sys.path order satisfies it and this cannot be fixed by an env var or a
      # CI tweak -- renaming a bind-mounted training package is an operator call.
      # Measured 2026-07-24 on the dev box: 5 failed, 38 passed, 5 skipped.
      # Re-measured 2026-08-01: 5 failed, **39 passed, 4 skipped** — one skip became a
      # pass. Not drift in the code: the suite is ENVIRONMENT-SENSITIVE here (ollama is
      # installed on this dev box, so a test gated on its absence now runs), which means
      # the pass/skip split legitimately differs between this box and a CI runner. The
      # FAILING count is the stable part and the only part this comment should be read
      # for: 5, unchanged, all the dottie name collision.
      # This is now the LAST non-blocking pytest step. When the rename lands, delete
      # the `|| true` and this comment with it.
      #
      # CORRECTED 2026-08-01. Everything above is accurate EXCEPT the implication that
      # a rename is the only fix. Both dirs ship an __init__.py, so they are REGULAR
      # packages and PEP 420 namespace merging does not apply -- "no sys.path order
      # satisfies it" holds. But extending the loaded package's __path__ does work, and
      # was verified end to end rather than reasoned about:
      #     import dottie                       # resolves to apps/dottie/dottie
      #     dottie.__path__.append(".../apps/ava-factory/dottie")
      #     import dottie.rl                    # -> OK
      #     from ava.rl.codeact_eg_gate import RungLadder   # -> OK
      # The real chain is one level deeper than described above: apps/dottie's
      # climb.py:521 imports ava.rl.codeact_eg_gate, and apps/ava-factory/ava/rl/
      # __init__.py is literally `"""Shim: ava.rl -> dottie.rl"""`. Nothing in
      # apps/dottie or the harness imports dottie.rl directly.
      # NOT APPLIED, deliberately: merging two packages that genuinely differ, across a
      # FROZEN boundary, to satisfy a test is an architectural decision and not a CI
      # one. Recorded so the next reader knows a third option exists and does not have
      # to rediscover it -- the choice between rename, __path__ merge, and leaving it
      # non-blocking stays the operator's.
      - name: Pytest ava-open-harness (non-blocking — dottie name collision, see comment)
        run: uv run pytest packages/ava-open-harness -q || true
      - name: GOAT audit (Carmack/Bellard) — regressions only
        # Mechanized slice of tasks/artifacts/goat_audit_monorepo.md, run on every
        # push so NEW plugins are held to the family's bar. --check fails only on a
        # REGRESSION vs .goat_baseline.json, so pre-existing debt does not block CI
        # (that is how a lint gets disabled). --min-mean holds new plugins to 7.0.
        run: |
          cd apps/scout-cli
          python scripts/goat_audit.py --check --min-mean 7.0
      - name: Forge smoke test (single CLI doctrine)
        run: |
          cd apps/scout-cli
          uv run python -m bigbang.cli --json forge list
          uv run python -m bigbang.cli --json system doctor
      # WAS: `- name: Eval gate quick (nano)` running
      #   uv run python -m packages.ava-open-harness.cli --help 2>&1 | head -n 20 || true
      # Three things wrong with that one line, flagged in the 2026-07-22 review
      # (knowledge/reviews/docs-metadata.md) and still live ten days later:
      #   1. `packages.ava-open-harness.cli` is not an importable module path — directory
      #      names with hyphens are not identifiers — AND no cli.py has ever existed in
      #      that package. The target was never real, so this is not a typo.
      #   2. `| head -n 20` means the shell reports HEAD's status, not python's, so the
      #      step passed even before `|| true` was reached. Same trap that invalidated an
      #      exit-code check earlier in this repo's history.
      #   3. `|| true` then discarded whatever was left.
      # So a step named "Eval gate" could not fail for any reason, including the package
      # being deleted outright. It was not a weak gate; it was a no-op wearing the name of
      # a gate — which is why gate_audit.py now reads a step's `name:` as context.
      #
      # Renamed to what it actually does. `python -m harness` is the real entry point
      # (harness/__main__.py; pyproject declares `ava-harness = "harness.runner:main"`),
      # verified locally: exits 0 and prints the arg parser. No `|| true` — if the harness
      # stops importing, this SHOULD go red. It is a smoke test, not an eval gate; the
      # nano eval gate remains unimplemented in CI and is not claimed here.
      - name: Harness CLI import smoke (not an eval gate)
        run: uv run python -m harness --help

  # SMOKE ONLY, and that is a decision — stated 2026-08-01 because an undocumented
  # exclusion is indistinguishable from an oversight (the same lesson `continue-on-error`
  # taught this repo: a check nobody wrote down looks exactly like one that works).
  #
  # apps/ava-factory's suite does not run in THIS job. Its requirements.txt pulls torch +
  # deepspeed; installing that on every push is not worth the minutes, and deepspeed in
  # particular is a heavy build. The import check below is the cheap proxy for the
  # failure mode CI can actually cause (a broken module graph), and the codeact-sandbox
  # job runs 730 of its tests without those deps.
  #
  # NO FIXED PASS COUNT IS QUOTED HERE, deliberately. This comment said "862 passing"
  # (itself a correction of "859"), and a re-measure the next day gave 861 passed / 1
  # FAILED — same code, same machine. The failure is
  # test_hard_negatives.py::TestAgainstTheRealRepo, whose floors are measured from a
  # corpus that grows ~295 documents a day because ast_pairs.py mines generated research
  # output as source. See HANDOFF item 8.
  #
  # So a pass count for this suite has a shelf life of about a day on a running box.
  # Writing one down here would be manufacturing exactly the stale figure the rest of
  # this workflow's comments warn about. Run it and read the number; do not carry one.
  #
  # WHAT THE EXCLUSION COSTS, measured 2026-08-01 rather than left as "some coverage".
  # The suite also reports 33 SKIPPED, and 29 of those are one thing:
  #     20  sandbox resource caps require POSIX
  #      8  hard wall/resource caps require POSIX
  #      1  sandbox caps require POSIX
  # Those are the codeact sandbox guardrails — the no-network / no-outside-write boundary
  # that codeact_sandbox.py enforces by rebinding open/socket and setting rlimits. They
  # skip on the Windows dev box because rlimits are POSIX-only, and they do not run here
  # because this whole app is excluded. So the tests for the security boundary currently
  # execute NOWHERE automatically. That is not an argument against the exclusion — the cost
  # reasoning above still holds — but "we skip an expensive suite" and "the sandbox tests
  # run nowhere" are different statements, and only the first was written down.
  #
  # They cannot be run from this machine today: the only WSL distro present is
  # docker-desktop (Docker's own VM, and Docker is not running), so there is no
  # general-purpose POSIX environment to fall back to. Running them needs Linux — a
  # container, WSL with a real distro, or a Linux job that installs the heavy deps.
  #
  # apps/dottie's suite is excluded for a DIFFERENT and harder reason: it does not collect
  # in the workspace env at all. Re-measured 2026-08-01 — `uv run pytest apps/dottie
  # --collect-only` gives 264 collected with 3 collection ERRORS, all
  # `ModuleNotFoundError: No module named 'fastapi'`, and that suite needs its own .venv
  # plus AVA_FACTORY_ROOT.
  #
  # "211 tests" was the figure here and it was STALE; run properly the suite is 287.
  #
  # RUN IT PROPERLY AND THE COLLISION IS THE WHOLE STORY. With apps/dottie/.venv (which
  # does have fastapi) and AVA_FACTORY_ROOT set:
  #     36 failed, 248 passed, 3 skipped, 3 errors
  # and 35 of those 36 are `ModuleNotFoundError: No module named 'dottie.rl'` — including
  # the test_api.py assertion failures, which only look different because the API returned
  # the import error where a status was expected
  # (`assert 'policy_unavailable' in "ModuleNotFoundError: No module named 'dottie.rl'"`).
  #
  # Measured what the __path__ merge would buy, with a throwaway conftest probe appended,
  # the suite re-run, and the probe reverted (tree verified clean afterwards):
  #     1 failed, 286 passed, 3 skipped, 0 errors
  # So the merge clears 35 failures and all 3 collection errors. The single survivor is
  # test_climb.py::test_cli_climb_smoke_and_report, which shells out to `python -m dottie
  # climb`; a conftest patch cannot reach a subprocess, so that one needs the fix to live
  # in the package rather than in test setup — which is itself an argument about WHICH of
  # the three options is right.
  #
  # Still an operator call, and still not a CI tweak. But it is no longer an abstract
  # three-way preference: option B is worth 35 tests, and doing nothing costs them.
  dottie-factory-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # WAS: `python -c "import sys; sys.path.insert(0, 'apps/ava-factory'); print('factory
      # importable')"` — which imported NOTHING. It adjusted sys.path and printed a string
      # claiming success, so it passed on any tree, including one where apps/ava-factory
      # had been deleted. Flagged 2026-07-22 (knowledge/reviews/docs-metadata.md), fixed
      # 2026-08-01. The comment above already described this step as the cheap proxy that
      # "catches a broken module graph"; it just never performed the import that would.
      #
      # `dottie` and `ava` both import with stdlib only (verified: the torch-dependent
      # modules are deeper — dottie.serve_engine and multi_jspace_module both raise
      # ModuleNotFoundError: torch), so this stays cheap while actually exercising the
      # package __init__ chain, including ava/ being the `from dottie import *` shim.
      # Do NOT reach for serve_engine here; that turns a 2-second smoke into a torch install.
      - name: Check factory imports
        run: |
          python -c "import sys; sys.path.insert(0, 'apps/ava-factory'); import dottie, ava; print('factory module graph OK:', dottie.__name__, ava.__name__)"
      - name: Verify no telemetry tracked
        run: |
          if git ls-files | grep -E "dottie_live_status|dottie_telemetry|STATUS.json|results.tsv" ; then echo "Telemetry still tracked!"; exit 1; fi
          echo "Telemetry clean ✓"

  bluehenre-checks:
    # The Dottie site (apps/bluehenre) — zero-dep, bare-node. Enforces the
    # provenance guarantees: pure parsers, the Hub exporter parser, and that the
    # committed hub_registry.json still matches its source cards (never stale).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Twin contract suite (pure parsers)
        run: node apps/bluehenre/public/js/twin.contract.test.mjs
      - name: Hub registry exporter parser regression
        run: node apps/bluehenre/scripts/build_hub_registry.test.mjs
      - name: Hub registry freshness (rendered matches source)
        run: node apps/bluehenre/scripts/build_hub_registry.mjs --check
      - name: Monitor runs readout freshness (matches the eval reports)
        run: node apps/bluehenre/scripts/build_runs_readout.mjs --check
      # WAS a hardcoded list of six files. apps/bluehenre tracks THIRTEEN .mjs, and the two
      # the list missed outright were `api/fleet.mjs` and `api/twin-status.mjs` — server
      # handlers for a live site (www.bhenre.com). `node --check` parses ONE file and does
      # not follow imports, so checking server.mjs never covered them. A hardcoded list
      # does not fail when it falls behind; it just quietly checks less, which is the same
      # rot as a hardcoded count going stale, and the rest of this repo already treats that
      # as a defect. Enumerated from git instead, so a new .mjs is covered the day it lands.
      #
      # The floor is not decoration. `for f in $(...)` over an EMPTY list runs zero times
      # and exits 0 — a step that cannot fail, which is precisely the shape this workflow
      # was audited for on 2026-08-01. If the enumeration ever breaks, this must go red
      # rather than silently pass having checked nothing. 10 sits below the current 13 so
      # ordinary adds and removals do not churn it, while a collapse to a handful trips it.
      # Verified by mutation: pointing the enumeration at a suffix that matches nothing
      # gives n=0 and exits 1 instead of "passing" over an empty loop.
      #
      # The count is 13 rather than 12 because `git ls-files 'apps/bluehenre/**/*.mjs'`
      # silently omits top-level server.mjs — `**/` requires at least one directory level.
      # That near-miss is the argument for enumerating with a plain prefix plus a suffix
      # filter: the clever glob was wrong in exactly the quiet direction, missing a file
      # while looking authoritative.
      - name: JS syntax check (every tracked .mjs, not a hardcoded list)
        run: |
          set -euo pipefail
          files=$(git ls-files apps/bluehenre | grep '\.mjs$')
          n=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$n" -lt 10 ]; then
            echo "Expected at least 10 tracked .mjs files under apps/bluehenre, found $n."
            echo "The enumeration broke or the app moved - fix this rather than lowering the floor."
            exit 1
          fi
          echo "syntax-checking $n files"
          for f in $files; do
            node --check "$f"
          done
      # Release gate (tasks/production_workflow.md). The unit tests lock the
      # HONESTY contract the G3 smoke asserts against a deployed URL: registry
      # drift named to the exact field path, assistant replies stamped from
      # {dottie, offline}, and the retracted 275.95 ppl allowed ONLY beside a
      # retraction marker. --pre re-runs the release checks as one exit-coded
      # command so a deploy needs no remembered sequence. The G3 smoke itself is
      # NOT run here: it needs a deployed URL, and CI must not depend on
      # www.bhenre.com being up to pass.
      - name: Release gate assertions (honesty contract)
        run: node apps/bluehenre/scripts/release_gate.test.mjs
      - name: Release gate --pre (the documented pre-deploy sequence, one command)
        run: node apps/bluehenre/scripts/release_gate.mjs --pre

  # The codeact sandbox is the security boundary: codeact_sandbox.py enforces no-network
  # and no-outside-write by rebinding open/socket and setting rlimits. Its tests were
  # running NOWHERE — they skip on the Windows dev box ("sandbox resource caps require
  # POSIX", since rlimits are POSIX-only) and apps/ava-factory is excluded from the main
  # job because its requirements.txt pulls torch + deepspeed.
  #
  # That exclusion is still right, and this job does not undo it. The five files below need
  # only pytest + zstandard + numpy — no torch, no deepspeed, no workspace sync. Collects
  # 70 tests in well under a second: sandbox 17, rewards 19, datagen 12, eval 11, loop 11.
  # test_codeact_policy.py is deliberately EXCLUDED because it imports torch, which is the
  # cost this job avoids, so 2 of the 29 POSIX-gated tests stay uncovered — stated rather
  # than rounded into "the sandbox is tested now".
  #
  # numpy is in that list because I first shipped this WITHOUT it (bd618df) and CI failed:
  # `ava.datagen.base` re-exports `dottie.datagen`, whose __init__ imports wiki_gen ->
  # pxpipe -> numpy. I had "measured" the dependency set with
  # `uv run --no-project ... ` from inside the repo, where uv still discovers the workspace
  # .venv and numpy was silently visible. The measurement was contaminated by the very
  # environment the job does not have. Re-measured from a directory OUTSIDE the repo, with
  # `import numpy` confirmed to FAIL first, so the isolation was proven before the result
  # was trusted.
  #
  # On ubuntu the POSIX gates pass, so these actually execute instead of skipping.
  codeact-sandbox:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because tests/test_hard_negatives.py mines the REAL git history,
      # exactly as scripts/test_retrieval_eval.py does in the lint-and-test job. Its own
      # assertion says it best -- "git history unavailable, this guard must not skip
      # silently" -- so a shallow clone fails it loudly rather than passing quietly.
      # Eight tests depend on it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Same state-pollution gate the lint-and-test job runs around scout-cli, now around
      # THIS suite. ava-factory is the reason the sweep's corpus was widened in the first
      # place: it does not write to HOME, it writes to apps/ava-factory/reports/, which is
      # gitignored — so `git status` stayed clean while the suite appended ~5 KB of test
      # records to the operator's live telemetry on every run. tests/conftest.py now
      # redirects DOTTIE_TELEMETRY_DIR/AVA_TELEMETRY_DIR; this proves it stays redirected.
      #
      # A SECOND pair rather than one spanning both jobs: each pair names its own suite, so
      # a failure says which one wrote. A gate that cannot name the culprit gets muted.
      #
      # Bare python3, no uv: the sweep is stdlib-only (verified by AST — argparse, json,
      # sys, pathlib), so it costs this job no dependency resolution.
      #
      # NOTE the runner env, discovered at 21ec0c4: ubuntu-latest sets
      # XDG_CONFIG_HOME=/home/runner/.config, which sits ABOVE Path.home() in scout-cli's
      # policy resolution and escaped its HOME redirect. Printed here too — the same class
      # of escape would be invisible from a Windows dev box.
      - name: State snapshot (before the ava-factory suite)
        run: |
          set -euo pipefail
          echo "HOME=$HOME  XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<unset>}  DOTTIE_TELEMETRY_DIR=${DOTTIE_TELEMETRY_DIR:-<unset>}"
          python3 scripts/state_pollution_sweep.py --snapshot "$RUNNER_TEMP/factory-before.json"
      - name: Sandbox guardrail tests (POSIX-only; skipped on the Windows dev box)
        working-directory: apps/ava-factory
        run: |
          set -euo pipefail
          uv run --no-project --with pytest --with zstandard --with numpy python -m pytest \
            tests/test_codeact_sandbox.py tests/test_codeact_eval.py \
            tests/test_codeact_loop.py tests/test_codeact_datagen.py \
            tests/test_codeact_rewards.py -q -rs | tee /tmp/sandbox.txt
          # A FLOOR, because the entire point is that these RUN rather than skip. Without
          # it a future change could make every test skip for a new reason and this job
          # would go green having verified nothing — the vacuous-pass shape this repo keeps
          # finding. 27 of the 29 POSIX-gated tests live in these files; 60 is a floor
          # comfortably under the 70 collected, so ordinary edits do not churn it.
          passed=$(grep -oE '[0-9]+ passed' /tmp/sandbox.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "sandbox tests passed: ${passed}"
          if [ "${passed}" -lt 60 ]; then
            echo "FAIL: only ${passed} sandbox tests ran (floor 60)."
            echo "These are POSIX-gated; if they are skipping HERE the guardrails are"
            echo "unverified everywhere. Fix the cause rather than lowering the floor."
            exit 1
          fi
      # THE REST OF THE CHEAP SUITE. apps/ava-factory collects ~862 tests (a COLLECTION
      # size, which is stable; do not read it as a pass count — see the note in the
      # lint-and-test job about why no pass count is quoted for this suite). The step
      # above runs 70 of them.
      # Measured 2026-08-02 that most of the rest needs no torch either — only pyyaml on top
      # of the deps above. This runs everything that will collect, so the app goes from ~8%
      # covered in CI to most of it, still without torch or deepspeed.
      #
      # EXCLUSIONS, named individually so "most of it" cannot quietly become "some of it":
      #   test_codeact_policy.py     imports torch  — the cost this job exists to avoid
      #   test_rl_smoke_wiring.py    imports torch  — same
      #   test_causal_reason.py      needs the app installed, not just importable
      #   test_codeact_consolidation.py  same
      # The last two report `No module named 'dottie'`/`'ava'` for packages that exist,
      # which is an import-path condition rather than a missing dependency. Excluded rather
      # than papered over; if a future change makes them importable, drop them from the list
      # and the floor below will rise on its own.
      #
      # --continue-on-collection-errors so ONE unimportable file cannot mask the result of
      # every other file, which is what interrupted the local measurement repeatedly.
      #
      # The floor is again the point: these are pytest SKIPS when a gate does not pass, so a
      # green run with everything skipped would otherwise look identical to success. 600 is
      # under the 656 measured locally, leaving room for platform differences without
      # letting a collapse through.
      - name: Rest of the cheap ava-factory suite (no torch, no deepspeed)
        working-directory: apps/ava-factory
        run: |
          set -euo pipefail
          # Explicit file list, NOT --ignore. pytest resolves rootdir to the REPO ROOT
          # (there is a pyproject.toml there), so `--ignore=tests/x.py` never matched
          # `apps/ava-factory/tests/x.py` and both torch files were collected anyway.
          # Letting the shell build the list removes pytest path matching from it.
          # test_hard_negatives.py is excluded, and the reason is a finding rather than
          # a flake. CORRECTED 2026-08-02: I first blamed the local virtualenvs; that was
          # wrong, ast_pairs.py:210 skips .venv explicitly. The real cause is generated
          # output. ast_pairs.walk() has no gitignore awareness, so it scans
          # apps/dottie/data/research/workspaces/*/candidate_*.py as source:
          #     1,282 files scanned, 581 of them generated (45.3%), 502 candidate_*.py
          # all written by the Dottie Research runner and none tracked by git. A clean CI
          # checkout has zero, so the same assertion reads `risky >= 280` -> only 21.
          # The tests are right; the constants are machine-specific. See HANDOFF item 8 —
          # this affects the MINED TRAINING DATA too, not just these floors.
          FILES=$(ls tests/test_*.py | grep -vE 'test_codeact_policy|test_rl_smoke_wiring|test_causal_reason|test_codeact_consolidation|test_hard_negatives')
          echo "running $(echo "$FILES" | wc -l) test files"
          # All --with flags on ONE physical line. Splitting them across a shell line
          # continuation made uv report `invalid version '--with'` (78a198c) — the
          # working step above keeps them on one line too. Not worth diagnosing further
          # when the fix is this cheap.
          uv run --no-project --with pytest --with zstandard --with numpy --with pyyaml --with regex --with requests --with tokenizers --with datasketch python -m pytest $FILES -q --continue-on-collection-errors | tee /tmp/cheap.txt
          passed=$(grep -oE '[0-9]+ passed' /tmp/cheap.txt | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "cheap ava-factory tests passed: ${passed}"
          if [ "${passed}" -lt 600 ]; then
            echo "FAIL: only ${passed} passed (floor 600). Either a real regression, or"
            echo "collection broke and most of the suite silently stopped running."
            exit 1
          fi
      # Closes the pair opened before the sandbox step. Covers BOTH ava-factory test steps,
      # which is still one suite, so attribution survives. --diff refuses to pass on an
      # empty snapshot, so this cannot go green by measuring nothing.
      - name: State pollution (the ava-factory suite must not write real state)
        run: |
          set -euo pipefail
          python3 scripts/state_pollution_sweep.py --snapshot "$RUNNER_TEMP/factory-after.json"
          python3 scripts/state_pollution_sweep.py --diff "$RUNNER_TEMP/factory-before.json" "$RUNNER_TEMP/factory-after.json"

# Dottie local control plane.
#
# This compose runs the canonical jarvisd state/auth service. Arxiviq connects through
# its server-side BFF with JARVIS_URL=http://127.0.0.1:8790. No duplicate pair store,
# queue, daemon, model, or harness capability is simulated here.
#
# Set JARVIS_BEARER in the environment before starting. jarvisd refuses its container
# 0.0.0.0 bind when the bearer is absent; the host publication remains loopback-only.

name: dottie-tandem

services:
  jarvisd:
    build:
      context: .
      dockerfile: Dockerfile.jarvisd
      args:
        JARVISD_SYNC_ARGS: ""
    image: dottie/jarvisd:local
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      JARVIS_BEARER: ${JARVIS_BEARER:?JARVIS_BEARER must be set and non-empty}
      JARVIS_BRAIN: ${JARVIS_BRAIN:-off}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jarvis-data:/data
      - jarvis-workspace:/workspace

volumes:
  jarvis-data:
  jarvis-workspace:
